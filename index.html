<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f6e4b">
  <title>PenguinMoney - 支出明細</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --brand: #0f6e4b;
      --brand-2: #178e62;
      --brand-soft: #e8f5ee;
      --text: #1f2937;
      --muted: #6b7280;
      --danger: #dc2626;
      --surface: #ffffff;
      --surface-2: #f3f6f4;
      --background: #f1f5f3;
      --border: #e5ebe8;
      --shadow: 0 4px 18px rgba(15, 110, 75, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e8efeb;
        --muted: #9aa8a1;
        --danger: #f87171;
        --surface: #1b2420;
        --surface-2: #232e29;
        --background: #121916;
        --border: #2b3732;
        --brand-soft: #1d3228;
        --shadow: 0 4px 18px rgba(0, 0, 0, .35);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-bottom: max(28px, env(safe-area-inset-bottom));
    }

    .container { max-width: 640px; margin: 0 auto; }

    /* ---------- 頂部 ---------- */
    .hero {
      background: linear-gradient(145deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
      padding: max(18px, env(safe-area-inset-top)) 18px 76px;
      border-radius: 0 0 28px 28px;
      position: relative;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 38px; height: 38px;
      display: grid; place-items: center;
      background: rgba(255, 255, 255, .18);
      border-radius: 12px;
      font-size: 22px;
    }
    .brand-name { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
    .brand-sub { font-size: 12px; opacity: .8; margin-top: 2px; }

    .month-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 18px;
    }
    .nav-btn {
      width: 38px; height: 38px;
      border: 0; border-radius: 12px;
      background: rgba(255, 255, 255, .18);
      color: #fff; font-size: 20px; line-height: 1;
      display: grid; place-items: center;
      cursor: pointer;
    }
    .nav-btn:disabled { opacity: .3; cursor: default; }
    .nav-btn:active:not(:disabled) { background: rgba(255, 255, 255, .3); }
    .month-title { font-size: 17px; font-weight: 700; }

    .total-label { margin-top: 14px; font-size: 13px; opacity: .85; text-align: center; }
    .total {
      font-size: 40px; font-weight: 800; text-align: center;
      margin: 4px 0 2px; letter-spacing: .5px;
      overflow-wrap: anywhere;
    }
    .count { text-align: center; font-size: 12px; opacity: .8; }

    /* ---------- 內容 ---------- */
    .content { padding: 0 14px; margin-top: -52px; position: relative; }

    .card {
      background: var(--surface);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; min-width: 0; }
    .stat-label { font-size: 12px; color: var(--muted); }
    .stat-value { font-size: 18px; font-weight: 750; margin-top: 6px; overflow-wrap: anywhere; }

    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .section-title { font-size: 16px; font-weight: 750; margin: 0; }
    .section-note { font-size: 12px; color: var(--muted); }

    /* ---------- 分類比例 ---------- */
    .bar {
      display: flex; height: 14px; border-radius: 7px; overflow: hidden;
      background: var(--surface-2); gap: 2px;
    }
    .bar-seg { min-width: 3px; transition: flex-grow .4s ease; }

    .legend { margin-top: 14px; }
    .legend-row {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 8px; margin: 0 -8px;
      border: 0; background: transparent; color: inherit; font: inherit; text-align: left;
      border-radius: 12px; cursor: pointer;
    }
    .legend-row:active { background: var(--surface-2); }
    .legend-row.active { background: var(--brand-soft); }
    .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
    .legend-name { flex: 1; font-size: 14px; font-weight: 650; min-width: 0; overflow-wrap: anywhere; }
    .legend-pct { font-size: 12px; color: var(--muted); min-width: 44px; text-align: right; }
    .legend-amt { font-size: 14px; font-weight: 700; min-width: 72px; text-align: right; }

    /* ---------- 篩選 ---------- */
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
    .filters .full { grid-column: 1 / -1; }

    input, select {
      width: 100%; min-height: 44px;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface-2); color: var(--text);
      padding: 10px 12px; font: inherit; font-size: 14px; outline: none;
      -webkit-appearance: none; appearance: none; min-width: 0;
    }
    select {
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px;
      background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
      padding-right: 32px;
    }
    input:focus, select:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(23, 142, 98, .18); }

    .clear-btn {
      border: 0; background: transparent; color: var(--brand-2);
      font: inherit; font-size: 13px; font-weight: 650; padding: 6px 2px; cursor: pointer;
    }

    /* ---------- 紀錄列表 ---------- */
    .day { margin-top: 18px; }
    .day:first-child { margin-top: 8px; }
    .day-head {
      display: flex; align-items: baseline; justify-content: space-between;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .day-title { font-size: 13px; font-weight: 750; color: var(--brand-2); }
    .day-total { font-size: 12px; color: var(--muted); }

    .record { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .day .record:last-child { border-bottom: 0; padding-bottom: 2px; }
    .record-icon {
      width: 42px; height: 42px; flex-shrink: 0;
      display: grid; place-items: center;
      background: var(--surface-2); border-radius: 13px; font-size: 20px;
    }
    .record-info { flex: 1; min-width: 0; }
    .record-name { font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
    .record-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .tag {
      font-size: 11px; color: var(--muted);
      background: var(--surface-2); border-radius: 8px; padding: 2px 8px;
    }
    .amount { color: var(--danger); font-weight: 750; font-size: 15px; white-space: nowrap; }

    /* ---------- 狀態 ---------- */
    .notice { text-align: center; color: var(--muted); font-size: 13px; padding: 28px 8px; }
    .notice .emoji { font-size: 34px; display: block; margin-bottom: 8px; }

    .status {
      margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; box-shadow: var(--shadow);
      background: var(--surface); color: var(--brand-2); font-size: 13px; line-height: 1.5;
      position: relative;
    }
    .status.error { background: var(--surface); color: var(--danger); border: 1px solid rgba(220, 38, 38, .35); }
    .retry {
      display: inline-block; margin-top: 8px; border: 0; border-radius: 10px;
      background: var(--danger); color: #fff; font: inherit; font-size: 13px; padding: 7px 14px; cursor: pointer;
    }

    .skeleton { position: relative; overflow: hidden; background: var(--surface-2); border-radius: 10px; }
    .skeleton::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent);
      transform: translateX(-100%); animation: shimmer 1.3s infinite;
    }
    @keyframes shimmer { to { transform: translateX(100%); } }
    .sk-row { height: 52px; margin-top: 12px; }

    .loading .total, .loading .stat-value { opacity: .45; }

    @media (max-width: 380px) {
      .total { font-size: 34px; }
      .card { padding: 15px; }
      .legend-amt { min-width: 60px; }
    }
  </style>
</head>

<body>
  <div class="container" id="app">
    <header class="hero">
      <div class="brand">
        <div class="logo">🐧</div>
        <div>
          <div class="brand-name">PenguinMoney</div>
          <div class="brand-sub">支出明細</div>
        </div>
      </div>

      <div class="month-nav">
        <button class="nav-btn" id="prevMonth" aria-label="上一個月">‹</button>
        <div class="month-title" id="monthTitle">載入中…</div>
        <button class="nav-btn" id="nextMonth" aria-label="下一個月">›</button>
      </div>

      <div class="total-label" id="totalLabel">本月總支出</div>
      <div class="total" id="totalAmount">—</div>
      <div class="count" id="recordCount">正在取得紀錄…</div>
    </header>

    <main class="content">
      <div id="status" class="status" role="status">正在連線並驗證 LINE 身分…</div>

      <section class="card">
        <div class="stats">
          <div class="stat">
            <div class="stat-label">平均每日支出</div>
            <div class="stat-value" id="averageAmount">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">最高單筆支出</div>
            <div class="stat-value" id="maxAmount">—</div>
          </div>
        </div>
      </section>

      <section class="card" id="breakdownCard" hidden>
        <div class="section-head">
          <h2 class="section-title">支出分類</h2>
          <span class="section-note">點選分類可篩選</span>
        </div>
        <div class="bar" id="bar"></div>
        <div class="legend" id="legend"></div>
      </section>

      <section class="card">
        <div class="section-head">
          <h2 class="section-title">支出紀錄</h2>
          <span class="section-note" id="filteredCount">0 筆</span>
        </div>

        <div class="filters">
          <div class="full">
            <input id="keywordInput" type="search" placeholder="搜尋項目、類別或帳戶" aria-label="關鍵字">
          </div>
          <select id="categoryFilter" aria-label="支出類別">
            <option value="">全部類別</option>
          </select>
          <select id="dateFilter" aria-label="日期">
            <option value="">全部日期</option>
          </select>
        </div>
        <div style="text-align:right"><button class="clear-btn" id="clearFilters" hidden>清除篩選</button></div>

        <div id="skeleton" hidden>
          <div class="skeleton sk-row"></div>
          <div class="skeleton sk-row"></div>
          <div class="skeleton sk-row"></div>
        </div>
        <div id="expenseList"></div>
        <div id="emptyState" class="notice" hidden><span class="emoji">🧾</span>沒有符合條件的支出紀錄</div>
      </section>
    </main>
  </div>

  <script>
    // LINE Developers 後台的 LIFF ID。
    const LIFF_ID = "2012018149-FSmvALEp";

    // GAS Web App 網址（部署後的 /exec）
    // 網頁只傳送 LINE ID Token、年、月；使用者身分與 Firestore 路徑都由 GAS 端驗證後決定。
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwk3XwI9Dbz8rAN6PHbVt8t7h57y8jpOfvujOSM1mK-NGNILSUiNjSQu66zAgs7au1jbw/exec";

    const PALETTE = ["#00a859", "#1e88e5", "#f9a825", "#8e24aa", "#00acc1", "#6d4c41", "#e53935", "#546e7a"];
    const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

    let idToken = null;
    let allRecords = [];
    let currentData = null;
    let selected = null; // {year, month}
    let requestSeq = 0;

    const $ = id => document.getElementById(id);
    const money = value => "$" + Number(value || 0).toLocaleString("zh-TW", { maximumFractionDigits: 2 });

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function showStatus(message, isError = false, onRetry = null) {
      const box = $("status");
      box.replaceChildren();
      box.classList.toggle("error", isError);
      box.hidden = !message;
      if (!message) return;

      box.append(document.createTextNode(message));
      if (onRetry) {
        const btn = el("button", "retry", "重新載入");
        btn.addEventListener("click", onRetry);
        box.append(document.createElement("br"), btn);
      }
    }

    // ---------- 月份 ----------
    function currentYearMonth() {
      const now = new Date();
      return { year: now.getFullYear(), month: now.getMonth() + 1 };
    }

    function isCurrentMonth(ym) {
      const now = currentYearMonth();
      return ym.year === now.year && ym.month === now.month;
    }

    function shiftMonth(delta) {
      const date = new Date(selected.year, selected.month - 1 + delta, 1);
      const next = { year: date.getFullYear(), month: date.getMonth() + 1 };
      const now = currentYearMonth();

      // 不查詢未來的月份
      if (next.year > now.year || (next.year === now.year && next.month > now.month)) return;

      selected = next;
      resetFilters();
      loadMonth();
    }

    function updateMonthNav() {
      $("monthTitle").textContent = `${selected.year} 年 ${selected.month} 月`;
      $("nextMonth").disabled = isCurrentMonth(selected);
      $("totalLabel").textContent = isCurrentMonth(selected) ? "本月總支出" : "當月總支出";
    }

    // ---------- API ----------
    async function callMonthApi(year, month) {
      // 用 text/plain 送出，避免瀏覽器對 GAS 發出 CORS preflight（GAS 不支援 OPTIONS）
      const response = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "liff_month", idToken: idToken, year: year, month: month }),
        redirect: "follow"
      });

      if (!response.ok)
        throw new Error("讀取支出資料失敗（HTTP " + response.status + "）。");

      const result = await response.json();

      if (!result || result.success !== true)
        throw new Error((result && result.error) || "讀取支出資料失敗。");

      return result.data;
    }

    async function loadMonth() {
      const seq = ++requestSeq;
      updateMonthNav();
      document.body.classList.add("loading");
      $("skeleton").hidden = false;
      $("expenseList").replaceChildren();
      $("emptyState").hidden = true;
      showStatus("正在讀取這個月的支出紀錄…");

      try {
        const result = await callMonthApi(selected.year, selected.month);

        // 快速連點切換月份時，只採用最後一次請求的結果
        if (seq !== requestSeq) return;

        currentData = result;
        allRecords = Array.isArray(result.records) ? result.records : [];
        renderHero();
        renderBreakdown();
        rebuildFilters();
        renderRecords();
        showStatus("");
      } catch (error) {
        if (seq !== requestSeq) return;

        console.error("[LIFF] 載入月份失敗", error);
        showStatus(error.message || "讀取失敗，請稍後再試。", true, loadMonth);
        allRecords = [];
        $("breakdownCard").hidden = true;
        $("emptyState").hidden = false;
        $("emptyState").lastChild.textContent = "目前無法載入支出紀錄。";
        $("filteredCount").textContent = "—";
      } finally {
        if (seq === requestSeq) {
          document.body.classList.remove("loading");
          $("skeleton").hidden = true;
        }
      }
    }

    // ---------- 頂部統計 ----------
    function renderHero() {
      const { year, month } = currentData;
      $("totalAmount").textContent = money(currentData.total);
      $("recordCount").textContent = `共 ${allRecords.length} 筆紀錄`;

      const total = allRecords.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const max = allRecords.reduce((highest, item) => Math.max(highest, Number(item.amount || 0)), 0);

      // 本月以今天為分母；查詢過去月份則以整月天數為分母。
      const now = new Date();
      const days = isCurrentMonth({ year, month }) ? now.getDate() : new Date(year, month, 0).getDate();
      $("averageAmount").textContent = money(days > 0 ? total / days : 0);
      $("maxAmount").textContent = money(max);
    }

    // ---------- 分類比例 ----------
    let categoryColors = {};

    function renderBreakdown() {
      const totals = {};
      allRecords.forEach(item => {
        const name = String(item.category || "").trim() || "未分類";
        totals[name] = (totals[name] || 0) + Number(item.amount || 0);
      });

      const list = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      const sum = list.reduce((s, [, amount]) => s + amount, 0);

      categoryColors = {};
      list.forEach(([name], index) => { categoryColors[name] = PALETTE[index % PALETTE.length]; });

      $("breakdownCard").hidden = list.length === 0 || sum <= 0;
      if (list.length === 0 || sum <= 0) return;

      const bar = $("bar");
      const legend = $("legend");
      bar.replaceChildren();
      legend.replaceChildren();

      list.forEach(([name, amount]) => {
        const pct = amount / sum * 100;

        const seg = el("div", "bar-seg");
        seg.style.flex = `${Math.max(pct, 0.5)} 1 0`;
        seg.style.background = categoryColors[name];
        seg.title = `${name} ${pct.toFixed(1)}%`;
        bar.append(seg);

        const row = el("button", "legend-row");
        row.type = "button";
        row.dataset.category = name;
        const dot = el("span", "dot");
        dot.style.background = categoryColors[name];
        row.append(dot, el("span", "legend-name", name), el("span", "legend-pct", pct.toFixed(1) + "%"), el("span", "legend-amt", money(amount)));
        row.addEventListener("click", () => {
          const select = $("categoryFilter");
          select.value = select.value === name ? "" : name;
          renderRecords();
        });
        legend.append(row);
      });
    }

    // ---------- 篩選 ----------
    function rebuildFilters() {
      const categorySelect = $("categoryFilter");
      const dateSelect = $("dateFilter");
      const previousCategory = categorySelect.value;
      const previousDate = dateSelect.value;

      categorySelect.replaceChildren(new Option("全部類別", ""));
      dateSelect.replaceChildren(new Option("全部日期", ""));

      const categories = [...new Set(allRecords.map(r => String(r.category || "").trim()).filter(Boolean))].sort();
      categories.forEach(category => categorySelect.add(new Option(category, category)));

      const dates = [...new Set(allRecords.map(r => String(r.date || "").trim()).filter(Boolean))].sort().reverse();
      dates.forEach(date => dateSelect.add(new Option(date.includes("/") ? date.slice(5) : date, date)));

      if ([...categorySelect.options].some(o => o.value === previousCategory)) categorySelect.value = previousCategory;
      if ([...dateSelect.options].some(o => o.value === previousDate)) dateSelect.value = previousDate;
    }

    function resetFilters() {
      $("keywordInput").value = "";
      $("categoryFilter").value = "";
      $("dateFilter").value = "";
    }

    function iconForCategory(category) {
      const value = String(category || "");
      if (value.includes("伙食") || value.includes("餐")) return "🍱";
      if (value.includes("交通") || value.includes("車")) return "🚌";
      if (value.includes("娛樂") || value.includes("運動")) return "🎾";
      if (value.includes("投資") || value.includes("學習")) return "📚";
      if (value.includes("雜費") || value.includes("生活")) return "🛍️";
      return "🧾";
    }

    function dayLabel(date) {
      const match = /^(\d{4})\/(\d{2})\/(\d{2})$/.exec(String(date || ""));
      if (!match) return date || "日期未知";

      const weekday = WEEKDAYS[new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])).getDay()];
      return `${Number(match[2])}/${Number(match[3])}（${weekday}）`;
    }

    // ---------- 紀錄列表（依日期分組）----------
    function renderRecords() {
      const keyword = $("keywordInput").value.trim().toLocaleLowerCase();
      const category = $("categoryFilter").value;
      const date = $("dateFilter").value;

      const filtered = allRecords.filter(item => {
        const itemCategory = String(item.category || "").trim() || "未分類";
        const searchable = [item.name, item.category, item.account].map(v => String(v || "").toLocaleLowerCase()).join(" ");

        return (!keyword || searchable.includes(keyword)) &&
          (!category || itemCategory === category) &&
          (!date || item.date === date);
      });

      // 圖例高亮目前選取的分類
      document.querySelectorAll(".legend-row").forEach(row => row.classList.toggle("active", row.dataset.category === category));
      $("clearFilters").hidden = !(keyword || category || date);

      const list = $("expenseList");
      list.replaceChildren();
      $("filteredCount").textContent = `${filtered.length} 筆`;
      $("emptyState").hidden = filtered.length !== 0;
      $("emptyState").lastChild.textContent = "沒有符合條件的支出紀錄";

      let currentDay = null;
      let dayBox = null;

      // 先算每天小計
      const dayTotals = {};
      filtered.forEach(item => {
        const key = item.date || "";
        dayTotals[key] = (dayTotals[key] || 0) + Number(item.amount || 0);
      });

      filtered.forEach(item => {
        const key = item.date || "";

        if (key !== currentDay) {
          currentDay = key;
          dayBox = el("section", "day");

          const head = el("div", "day-head");
          head.append(el("span", "day-title", dayLabel(key)), el("span", "day-total", "小計 " + money(dayTotals[key])));
          dayBox.append(head);
          list.append(dayBox);
        }

        const row = el("div", "record");
        row.append(el("div", "record-icon", iconForCategory(item.category)));

        const info = el("div", "record-info");
        info.append(el("div", "record-name", item.name || "未命名支出"));

        const meta = el("div", "record-meta");
        meta.append(el("span", "tag", item.category || "未分類"));
        if (item.account) meta.append(el("span", "tag", item.account));
        info.append(meta);

        row.append(info, el("div", "amount", "-" + money(item.amount)));
        dayBox.append(row);
      });
    }

    // ---------- 初始化 ----------
    async function initialize() {
      selected = currentYearMonth();
      updateMonthNav();

      $("prevMonth").addEventListener("click", () => shiftMonth(-1));
      $("nextMonth").addEventListener("click", () => shiftMonth(1));
      $("keywordInput").addEventListener("input", renderRecords);
      $("categoryFilter").addEventListener("change", renderRecords);
      $("dateFilter").addEventListener("change", renderRecords);
      $("clearFilters").addEventListener("click", () => { resetFilters(); renderRecords(); });

      try {
        if (!window.liff)
          throw new Error("LIFF SDK 載入失敗。");

        await liff.init({ liffId: LIFF_ID });

        // 外部瀏覽器尚未登入時，導向 LINE Login。
        if (!liff.isLoggedIn()) {
          showStatus("正在前往 LINE 登入…");
          liff.login();
          return;
        }

        idToken = liff.getIDToken();

        if (!idToken)
          throw new Error("使用者已登入，但仍無法取得 ID Token。請確認 openid 授權狀態。");

        await loadMonth();
      } catch (error) {
        console.error("[LIFF] 初始化失敗", error);
        showStatus(error.message || "LIFF 初始化失敗。", true);
      }
    }

    initialize();
  </script>
</body>
</html>
